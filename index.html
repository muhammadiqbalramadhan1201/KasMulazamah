<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kas Mulazamah</title>
  
  <!-- Link ke Manifest -->
  <link rel="manifest" href="manifest.json">
  <!-- Icon untuk iOS -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#ffffff">
  
  <style>
    /* Membuat iframe penuh tanpa margin */
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- Ganti dengan URL GAS Anda -->
  <iframe src="https://script.google.com/macros/s/AKfycbzo_eCdMXdFR8NUf3Va2iOQb6Su2EieV1jXRFczykbGu8_6SYU6H5rMIEsR1OPKQc5l5g/exec"></iframe>
  
  <script>
    // Mendaftarkan Service Worker agar terdeteksi sebagai PWA murni
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker terdaftar!', reg))
          .catch(err => console.error('Gagal daftar Service Worker', err));
      });
    }
  </script>
</body>
</html>
