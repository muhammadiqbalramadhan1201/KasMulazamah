<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Kas Mulazamah</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#ffffff">

  <style>
    /* ================================
       RESET & LAYOUT UTAMA
    ================================= */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    /* ================================
       IFRAME APLIKASI GAS
    ================================= */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      display: block;
    }

    /* ================================
       TOMBOL REFRESH
    ================================= */
    #refresh-button {
      position: fixed;
      top: 12px;
      right: 12px;

      width: 42px;
      height: 42px;

      border: none;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.95);
      color: #333;

      font-size: 27px;
      line-height: 42px;
      text-align: center;

      padding: 0;
      margin: 0;

      cursor: pointer;

      z-index: 9997;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.20);

      transition:
        transform 0.15s ease,
        background-color 0.15s ease;
    }

    #refresh-button:active {
      transform: rotate(180deg) scale(0.92);
      background: #eeeeee;
    }

    /* ================================
       OVERLAY INSTALL PWA
    ================================= */
    #install-overlay {
      display: none;

      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background-color: rgba(0, 0, 0, 0.7);

      z-index: 9998;

      justify-content: center;
      align-items: center;

      opacity: 0;

      transition: opacity 0.4s ease;

      pointer-events: none;
    }

    #install-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* ================================
       MODAL INSTALL
    ================================= */
    #install-modal {
      background: #ffffff;

      padding: 30px;

      border-radius: 20px;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.5);

      text-align: center;

      width: 85%;
      max-width: 400px;

      transform: scale(0.8);

      transition: transform 0.4s ease;

      box-sizing: border-box;
    }

    #install-overlay.show #install-modal {
      transform: scale(1);
    }

    /* ================================
       ICON PWA
    ================================= */
    .app-icon-placeholder {
      width: 80px;
      height: 80px;

      margin: 0 auto 20px auto;

      background-color: #eee;

      border-radius: 18px;

      background-image: url('icon-192.png');
      background-size: cover;
      background-position: center;

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* ================================
       JUDUL MODAL
    ================================= */
    #install-modal h2 {
      margin: 0 0 10px 0;

      font-size: 22px;

      color: #1c1e21;
    }

    /* ================================
       DESKRIPSI MODAL
    ================================= */
    #install-modal p {
      margin: 0 0 25px 0;

      font-size: 16px;

      color: #606770;

      line-height: 1.5;
    }

    /* ================================
       TOMBOL AKSI
    ================================= */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #btn-install {
      background-color: #007bff;

      color: white;

      border: none;

      padding: 15px;

      border-radius: 12px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: background-color 0.2s;
    }

    #btn-install:active {
      background-color: #0056b3;
    }

    #btn-close {
      background: none;

      border: none;

      color: #777;

      font-size: 14px;

      padding: 10px;

      cursor: pointer;

      text-decoration: none;
    }

    /* ================================
       HP
    ================================= */
    @media (max-width: 600px) {

      #refresh-button {
        top: 10px;
        right: 10px;

        width: 38px;
        height: 38px;

        font-size: 25px;
        line-height: 38px;
      }

      #install-modal {
        width: 88%;
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =================================
       APLIKASI GOOGLE APPS SCRIPT
  ================================== -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzo_eCdMXdFR8NUf3Va2iOQb6Su2EieV1jXRFczykbGu8_6SYU6H5rMIEsR1OPKQc5l5g/exec"
    allow="camera; microphone; geolocation">
  </iframe>


  <!-- =================================
       TOMBOL REFRESH
       ↻ = REFRESH SELURUH HALAMAN
  ================================== -->
  <button
    id="refresh-button"
    type="button"
    title="Refresh halaman"
    aria-label="Refresh halaman">
    ↻
  </button>


  <!-- =================================
       POPUP INSTALL PWA
  ================================== -->
  <div id="install-overlay">

    <div id="install-modal">

      <div class="app-icon-placeholder"></div>

      <h2>Install Kas Mulazamah</h2>

      <p>
        Akses aplikasi ini lebih cepat dan mudah
        langsung dari layar utama HP Anda.
      </p>

      <div class="action-buttons">

        <button id="btn-install" type="button">
          Tambahkan ke Layar Utama
        </button>

        <button id="btn-close" type="button">
          Nanti Saja
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =================================
       TOMBOL REFRESH
    ================================== */

    const refreshButton =
      document.getElementById('refresh-button');

    refreshButton.addEventListener('click', function () {

      /*
       * Reload halaman induk.
       * Karena iframe berada di dalam halaman ini,
       * iframe juga akan dimuat ulang dari awal.
       */
      window.location.reload();

    });


    /* =================================
       SERVICE WORKER
    ================================== */

    if ('serviceWorker' in navigator) {

      window.addEventListener('load', function () {

        navigator.serviceWorker.register('sw.js')

          .then(function (registration) {

            console.log(
              'Service Worker terdaftar!',
              registration
            );

          })

          .catch(function (error) {

            console.error(
              'Gagal daftar Service Worker',
              error
            );

          });

      });

    }


    /* =================================
       LOGIKA INSTALL PWA
    ================================== */

    let deferredPrompt = null;

    const installOverlay =
      document.getElementById('install-overlay');

    const btnInstall =
      document.getElementById('btn-install');

    const btnClose =
      document.getElementById('btn-close');


    /* Cek apakah sudah mode aplikasi */

    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone;


    /* =================================
       TAMPILKAN POPUP INSTALL
    ================================== */

    if (!isStandalone) {

      window.addEventListener(
        'beforeinstallprompt',
        function (event) {

          /*
           * Cegah popup bawaan browser.
           */
          event.preventDefault();

          deferredPrompt = event;

          /*
           * Tampilkan popup custom.
           */
          installOverlay.style.display = 'flex';

          setTimeout(function () {

            installOverlay.classList.add('show');

          }, 10);

        }
      );

    }


    /* =================================
       TOMBOL INSTALL
    ================================== */

    btnInstall.addEventListener(
      'click',
      async function () {

        hideModal();

        if (deferredPrompt) {

          deferredPrompt.prompt();

          try {

            const choiceResult =
              await deferredPrompt.userChoice;

            console.log(
              'Respon pengguna:',
              choiceResult.outcome
            );

          } catch (error) {

            console.error(
              'Install PWA gagal:',
              error
            );

          }

          deferredPrompt = null;

        }

      }
    );


    /* =================================
       TOMBOL NANTI SAJA
    ================================== */

    btnClose.addEventListener(
      'click',
      function () {

        hideModal();

      }
    );


    /* =================================
       SEMBUNYIKAN MODAL
    ================================== */

    function hideModal() {

      installOverlay.classList.remove('show');

      setTimeout(function () {

        installOverlay.style.display = 'none';

      }, 400);

    }

  </script>

</body>
</html>
